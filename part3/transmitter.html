<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha BFSK Transmitter</title>
<style>
  :root {
    --panel-bg: rgba(255, 255, 255, 0.94);
    --text: #1d232b;
    --muted: #55606d;
    --accent: #1f5fbf;
    --warn: #a14a00;
    --err: #b00020;
    --border: #c9d1db;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; user-select: none; }
  #overlay { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; will-change: opacity; }
  .panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: min(760px, calc(100vw - 32px));
    max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; background: var(--panel-bg);
    border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .panel h1 { font-size: 20px; margin: 0 0 4px; }
  .panel h2 { font-size: 16px; margin: 16px 0 6px; }
  .muted { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 14px; }
  label { display: flex; flex-direction: column; font-size: 14px; color: var(--muted); }
  input, select, textarea { font-size: 16px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); background: #fff; margin-top: 3px; }
  button { font-size: 16px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent);
    color: #fff; cursor: pointer; margin: 4px 8px 4px 0; }
  button.secondary { background: #fff; color: var(--accent); }
  #derived { margin-top: 10px; padding: 10px 12px; background: #eef3fa; border-radius: 8px; font-size: 14px; overflow-wrap: anywhere; }
  .warn { color: var(--warn); } .err { color: var(--err); font-weight: 600; }
  #countdown { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 30vh; font-weight: 700; color: #fff; text-shadow: 0 0 24px #000; pointer-events: none; }
  .hidden { display: none !important; }
  body.running { cursor: none; }
  kbd { border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; background: #fff; }
</style>
</head>
<body>
<img id="bg" alt="static background picture" draggable="false">
<div id="overlay"></div>
<div id="countdown"></div>

<div id="setup" class="panel">
  <h1>Alpha-channel BFSK transmitter</h1>
  <div class="muted">HiLight-style: a black layer over a static picture, its alpha switched each display frame.
    Bit 0 and bit 1 are two alpha-flicker frequencies.</div>
  <div id="refresh" class="muted" style="margin-top:8px">Measuring display refresh...</div>

  <h2>Parameters</h2>
  <div class="grid">
    <label>Recording label (file name)<input id="label" value="p3_da010_d020"></label>
    <label>Mode<select id="mode">
      <option value="sweep">sweep (all rates)</option>
      <option value="prbs">prbs (one rate)</option>
      <option value="text">text (words demo)</option>
      <option value="eyecheck">eye check</option>
    </select></label>
    <label>Camera profile<select id="profile">
      <option value="cam240">cam240: Slo-mo 240 fps</option>
      <option value="cam120">cam120: 120 fps video</option>
    </select></label>
    <label>Delta alpha<select id="dalpha">
      <option value="0.1">0.1</option><option value="0.5">0.5</option>
      <option value="0.05">0.05</option><option value="0.2">0.2</option><option value="0.3">0.3</option>
    </select></label>
    <label>Base alpha<input id="base" type="number" step="0.01" min="0" max="0.9" value="0"></label>
    <label>Symbol length N (frames, prbs/text)<input id="N" type="number" step="1" min="2" placeholder="profile default"></label>
    <label>f0 period (frames)<input id="p0" type="number" step="1" min="2" placeholder="profile default"></label>
    <label>f1 period (frames)<input id="p1" type="number" step="1" min="2" placeholder="profile default"></label>
    <label>Sweep symbol lengths (frames)<input id="sweepN" placeholder="profile default, e.g. 24,16,12,8,4"></label>
    <label>PRBS seed<input id="seed" type="number" step="1" value="1720"></label>
    <label>Packets per rate (sweep)<input id="packetsPerRate" type="number" step="1" min="1" value="2"></label>
    <label>Packets (prbs)<input id="packets" type="number" step="1" min="1" value="4"></label>
    <label>Payload bits per packet<input id="payloadBits" type="number" step="1" min="8" value="64"></label>
    <label>Text (words, demo)<input id="text" value="HELLO VITAL VISIONS"></label>
    <label>Characters per text packet<input id="textChars" type="number" step="1" min="1" value="10"></label>
    <label>Repeats (text)<input id="repeats" type="number" step="1" min="1" value="2"></label>
    <label>Countdown (s)<input id="countdownSec" type="number" step="1" min="0" value="5"></label>
    <label>Eye-check seconds per trial<input id="trialSec" type="number" step="1" min="2" value="5"></label>
  </div>
  <div id="derived"></div>
  <div style="margin-top:12px">
    <button id="start">Start (full screen)</button>
    <button id="remeasure" class="secondary">Re-measure refresh</button>
    <button id="copyurl" class="secondary">Copy URL with these settings</button>
  </div>
  <div class="muted" style="margin-top:6px">During transmission nothing but the picture is shown. <kbd>Esc</kbd> aborts.</div>
</div>

<div id="done" class="panel hidden">
  <h1 id="doneTitle">DONE</h1>
  <div id="doneStats" class="muted"></div>
  <div style="margin-top:12px">
    <button id="download">Download transmit log (JSON)</button>
    <button id="again" class="secondary">Back to setup</button>
  </div>
</div>

<div id="eyeprompt" class="panel hidden">
  <h1 id="eyeTitle">Eye check</h1>
  <div id="eyeBody"></div>
</div>

<pre id="selftest" class="hidden"></pre>

<script id="schedule-js">
/* BEGIN schedule.js */
/*
 * HiLight-style BFSK schedule for the alpha-channel transmitter.
 *
 * Everything is counted in DISPLAY FRAMES (vsync periods), never in seconds,
 * so the schedule is exact at whatever refresh the display really runs.
 * Python mirror: hilight_plan.py (tests/test_schedule_parity.py checks they agree).
 *
 * Per-frame "level": 0 -> alpha = base, 1 -> alpha = base + dalpha,
 * 0.5 -> idle (alpha = base + dalpha/2, the mean of every tone).
 * A tone with period P frames is high for the first P/2 frames of each period
 * (phase restarts at each block/symbol start).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    root.HiLightSchedule = factory();
  }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var BARKER13 = [1, 1, 1, 1, 1, 0, 0, 1, 1, 0, 1, 0, 1];

  // Tone periods in display frames and the symbol lengths (frames) of the sweep.
  // At a 120 Hz display: cam240 -> f0 = 30 Hz, f1 = 60 Hz, 5/7.5/10/15/30 bps.
  //                      cam120 -> f0 = 15 Hz, f1 = 30 Hz, 5/7.5/15 bps.
  var PROFILES = {
    cam240: { p0: 4, p1: 2, sweepN: [24, 16, 12, 8, 4], N: 12 },
    cam120: { p0: 8, p1: 4, sweepN: [24, 16, 8], N: 16 }
  };

  var DEFAULTS = {
    mode: 'sweep',        // sweep | prbs | text
    profile: 'cam240',
    dalpha: 0.1,
    base: 0.0,
    p0: null,             // null -> profile value
    p1: null,
    N: null,              // symbol length in frames for prbs/text modes
    sweepN: null,         // list of symbol lengths for sweep mode
    seed: 1720,
    packetsPerRate: 2,    // sweep mode
    packets: 4,           // prbs mode
    payloadBits: 64,      // sweep / prbs payload bits per packet
    text: 'HELLO VITAL VISIONS',
    textChars: 10,        // fixed characters per text packet (pads with spaces)
    repeats: 2,
    leadFrames: 120,
    pilotFrames: 120,
    gapFrames: 60
  };

  function lcm(a, b) {
    function gcd(x, y) { return y ? gcd(y, x % y) : x; }
    return a / gcd(a, b) * b;
  }

  function normalizeParams(p) {
    var out = {};
    var k;
    for (k in DEFAULTS) out[k] = DEFAULTS[k];
    for (k in (p || {})) if (p[k] !== undefined && p[k] !== null && p[k] !== '') out[k] = p[k];
    var prof = PROFILES[out.profile];
    if (!prof) throw new Error('unknown profile ' + out.profile);
    out.p0 = toInt(out.p0 === null ? prof.p0 : out.p0);
    out.p1 = toInt(out.p1 === null ? prof.p1 : out.p1);
    out.N = toInt(out.N === null ? prof.N : out.N);
    if (out.sweepN === null) out.sweepN = prof.sweepN.slice();
    if (typeof out.sweepN === 'string') out.sweepN = out.sweepN.split(',').map(toInt);
    out.sweepN = out.sweepN.map(toInt);
    ['seed', 'packetsPerRate', 'packets', 'payloadBits', 'textChars', 'repeats',
      'leadFrames', 'pilotFrames', 'gapFrames'].forEach(function (key) { out[key] = toInt(out[key]); });
    out.dalpha = Number(out.dalpha);
    out.base = Number(out.base);
    out.text = String(out.text);
    if (out.p0 === out.p1) throw new Error('p0 and p1 must differ');
    if (out.p0 < 2 || out.p1 < 2) throw new Error('tone periods must be >= 2 frames');
    var m = lcm(out.p0, out.p1);
    var Ns = out.mode === 'sweep' ? out.sweepN : [out.N];
    Ns.forEach(function (n) {
      if (n % m !== 0) throw new Error('symbol length ' + n + ' frames is not a multiple of lcm(p0,p1)=' + m);
    });
    if (out.base < 0 || out.base + out.dalpha > 1 || out.dalpha <= 0) throw new Error('need 0 <= base, 0 < dalpha, base+dalpha <= 1');
    return out;
  }

  function toInt(v) {
    var n = Number(v);
    if (!isFinite(n) || Math.floor(n) !== n) throw new Error('expected integer, got ' + v);
    return n;
  }

  // xorshift32 PRBS; output bit = top bit of the state after each step.
  function Prbs(seed) {
    var s = (seed >>> 0) || 0x9E3779B9;
    this.next = function () {
      s ^= (s << 13); s >>>= 0;
      s ^= (s >>> 17);
      s ^= (s << 5); s >>>= 0;
      return s >>> 31;
    };
    this.take = function (n) {
      var b = [];
      for (var i = 0; i < n; i++) b.push(this.next());
      return b;
    };
  }

  function crc8(bytes) {
    var c = 0;
    for (var i = 0; i < bytes.length; i++) {
      c ^= bytes[i];
      for (var j = 0; j < 8; j++) c = (c & 0x80) ? (((c << 1) ^ 0x07) & 0xFF) : ((c << 1) & 0xFF);
    }
    return c;
  }

  function byteBits(b) {
    var out = [];
    for (var i = 7; i >= 0; i--) out.push((b >> i) & 1);
    return out;
  }

  // Text packet payload: [length byte][textChars ASCII bytes, space padded][CRC-8 over both]
  function encodeTextChunk(chunk, textChars) {
    var bytes = [chunk.length];
    for (var i = 0; i < textChars; i++) {
      var c = i < chunk.length ? chunk.charCodeAt(i) : 32;
      if (c > 126 || c < 32) c = 63; // '?'
      bytes.push(c);
    }
    bytes.push(crc8(bytes));
    var bits = [];
    bytes.forEach(function (b) { bits = bits.concat(byteBits(b)); });
    return bits;
  }

  function textChunks(text, textChars) {
    var words = String(text).trim().split(/\s+/).filter(function (w) { return w.length > 0; });
    var chunks = [];
    words.forEach(function (w) {
      for (var i = 0; i < w.length; i += textChars) chunks.push(w.slice(i, i + textChars));
    });
    return chunks;
  }

  function buildPlan(params) {
    var p = normalizeParams(params);
    var blocks = [];
    var cursor = 0;
    function add(b) { b.startFrame = cursor; blocks.push(b); cursor += b.frames; }
    function packet(N, bits, extra) {
      var b = { type: 'packet', N: N, frames: N * bits.length, bits: bits, payloadStart: BARKER13.length };
      for (var k in extra) b[k] = extra[k];
      add(b);
      add({ type: 'idle', frames: p.gapFrames });
    }

    add({ type: 'idle', frames: p.leadFrames, label: 'lead' });
    add({ type: 'tone', period: p.p0, frames: p.pilotFrames, label: 'pilot0' });
    add({ type: 'tone', period: p.p1, frames: p.pilotFrames, label: 'pilot1' });
    add({ type: 'idle', frames: p.gapFrames });

    var prbs = new Prbs(p.seed);
    if (p.mode === 'sweep') {
      p.sweepN.forEach(function (N, si) {
        for (var k = 0; k < p.packetsPerRate; k++) {
          packet(N, BARKER13.concat(prbs.take(p.payloadBits)), { segment: si, packet: k });
        }
      });
    } else if (p.mode === 'prbs') {
      for (var k = 0; k < p.packets; k++) {
        packet(p.N, BARKER13.concat(prbs.take(p.payloadBits)), { segment: 0, packet: k });
      }
    } else if (p.mode === 'text') {
      var chunks = textChunks(p.text, p.textChars);
      var idx = 0;
      for (var r = 0; r < p.repeats; r++) {
        chunks.forEach(function (c) {
          packet(p.N, BARKER13.concat(encodeTextChunk(c, p.textChars)), { segment: 0, packet: idx++, text: c });
        });
      }
    } else {
      throw new Error('unknown mode ' + p.mode);
    }
    add({ type: 'idle', frames: p.gapFrames, label: 'tail' });
    return { params: p, blocks: blocks, totalFrames: cursor };
  }

  function toneLevel(f, period) { return (f % period) < period / 2 ? 1 : 0; }

  // Level of display frame k (0 <= k < totalFrames). `hint` is an optional
  // {i: blockIndex} cursor for O(1) sequential access.
  function levelAt(plan, k, hint) {
    var blocks = plan.blocks;
    var i = hint ? hint.i : 0;
    if (i >= blocks.length || blocks[i].startFrame > k) i = 0;
    while (i < blocks.length - 1 && k >= blocks[i].startFrame + blocks[i].frames) i++;
    if (hint) hint.i = i;
    var b = blocks[i];
    if (k < 0 || k >= plan.totalFrames) return 0.5;
    var f = k - b.startFrame;
    if (b.type === 'idle') return 0.5;
    if (b.type === 'tone') return toneLevel(f, b.period);
    var j = Math.floor(f / b.N);
    var period = b.bits[j] ? plan.params.p1 : plan.params.p0;
    return toneLevel(f - j * b.N, period);
  }

  function levels(plan) {
    var out = new Array(plan.totalFrames);
    var hint = { i: 0 };
    for (var k = 0; k < plan.totalFrames; k++) out[k] = levelAt(plan, k, hint);
    return out;
  }

  function alphaOf(plan, level) {
    return plan.params.base + plan.params.dalpha * level;
  }

  // Compact string of levels ('0', '1', 'm') used by the parity tests.
  function levelString(plan) {
    return levels(plan).map(function (v) { return v === 0.5 ? 'm' : String(v); }).join('');
  }

  function summary(plan, refreshHz) {
    var p = plan.params;
    var R = refreshHz || 120;
    var Ns = p.mode === 'sweep' ? p.sweepN : [p.N];
    return {
      f0: R / p.p0,
      f1: R / p.p1,
      ratesBps: Ns.map(function (n) { return R / n; }),
      seconds: plan.totalFrames / R,
      packets: plan.blocks.filter(function (b) { return b.type === 'packet'; }).length
    };
  }

  return {
    BARKER13: BARKER13,
    PROFILES: PROFILES,
    DEFAULTS: DEFAULTS,
    normalizeParams: normalizeParams,
    Prbs: Prbs,
    crc8: crc8,
    encodeTextChunk: encodeTextChunk,
    textChunks: textChunks,
    buildPlan: buildPlan,
    levelAt: levelAt,
    levels: levels,
    alphaOf: alphaOf,
    levelString: levelString,
    summary: summary
  };
});
/* END schedule.js */
</script>

<script>
(function () {
  'use strict';
  var S = window.HiLightSchedule;
  var $ = function (id) { return document.getElementById(id); };
  var FIELDS = ['label', 'mode', 'profile', 'dalpha', 'base', 'N', 'p0', 'p1', 'sweepN', 'seed', 'packetsPerRate',
    'packets', 'payloadBits', 'text', 'textChars', 'repeats', 'countdownSec', 'trialSec'];
  var refresh = { measuredHz: null, nominalHz: 120, samples: [] };
  var run = null;
  var lastLog = null;
  var skipPreviewForTest = false;

  window.addEventListener('error', function (e) {
    document.body.dataset.error = String(e.message || e);
  });

  $('bg').src = BG_DATA_URI;

  // ---------- parameters ----------
  function readQuery() {
    var q = new URLSearchParams(location.search);
    FIELDS.forEach(function (f) { if (q.has(f)) $(f).value = q.get(f); });
    return q;
  }
  function formParams() {
    var v = {};
    FIELDS.forEach(function (f) { v[f] = $(f).value.trim(); });
    var p = { mode: v.mode, profile: v.profile, dalpha: v.dalpha, base: v.base, seed: v.seed,
      packetsPerRate: v.packetsPerRate, packets: v.packets, payloadBits: v.payloadBits, text: v.text,
      textChars: v.textChars, repeats: v.repeats };
    if (v.N) p.N = v.N;
    if (v.p0) p.p0 = v.p0;
    if (v.p1) p.p1 = v.p1;
    if (v.sweepN) p.sweepN = v.sweepN;
    return { plan: p, label: v.label || 'p3', countdownSec: Number(v.countdownSec) || 0,
      trialSec: Number(v.trialSec) || 5, mode: v.mode, skipPreview: false };
  }
  function fmt(x, d) { return Number(x).toFixed(d === undefined ? 2 : d).replace(/\.?0+$/, ''); }

  function updateDerived() {
    var f = formParams();
    var el = $('derived');
    try {
      var planParams = Object.assign({}, f.plan, { mode: f.mode === 'eyecheck' ? 'sweep' : f.mode });
      var plan = S.buildPlan(planParams);
      var s = S.summary(plan, refresh.nominalHz);
      var html = 'At ' + refresh.nominalHz + ' Hz: f0 (bit 0) = <b>' + fmt(s.f0) + ' Hz</b>, f1 (bit 1) = <b>' + fmt(s.f1) +
        ' Hz</b>; symbol rate(s) <b>' + s.ratesBps.map(function (r) { return fmt(r); }).join(', ') + ' bps</b>. ';
      if (f.mode === 'eyecheck') {
        html += 'Eye check: ' + eyeTrials(plan, f).length + ' trials of ' + f.trialSec + ' s (delta alpha 0.1 and 0.5, shuffled).';
      } else {
        html += s.packets + ' packets, alpha in {' + fmt(plan.params.base) + ', ' + fmt(plan.params.base + plan.params.dalpha) +
          '}, transmission ' + fmt(s.seconds, 1) + ' s plus ' + f.countdownSec + ' s countdown.';
      }
      el.innerHTML = html;
      $('start').disabled = false;
      return plan;
    } catch (e) {
      el.innerHTML = '<span class="err">' + e.message + '</span>';
      $('start').disabled = true;
      return null;
    }
  }

  // ---------- refresh measurement ----------
  function measureRefresh(n) {
    return new Promise(function (resolve) {
      var ts = [];
      function step(t) {
        ts.push(t);
        if (ts.length <= n) requestAnimationFrame(step); else resolve(ts);
      }
      requestAnimationFrame(step);
    }).then(function (ts) {
      var d = [];
      for (var i = 1; i < ts.length; i++) d.push(ts[i] - ts[i - 1]);
      var sorted = d.slice().sort(function (a, b) { return a - b; });
      var med = sorted[Math.floor(sorted.length / 2)];
      refresh.measuredHz = 1000 / med;
      refresh.samples = d.map(function (x) { return Math.round(x * 1000) / 1000; });
      var hz = refresh.measuredHz;
      refresh.nominalHz = (Math.abs(hz - 120) < 6) ? 120 : (Math.abs(hz - 60) < 3) ? 60 : Math.round(hz);
      var msg = 'Measured display refresh: <b>' + fmt(hz, 1) + ' Hz</b> (median of ' + d.length + ' frames). ';
      if (refresh.nominalHz === 120) msg += 'Good: 120 Hz ProMotion.';
      else msg += '<span class="warn">Not 120 Hz. Use Chrome on the built-in display with ProMotion on and Low Power Mode off; ' +
        'at ' + refresh.nominalHz + ' Hz every frequency and rate scales by ' + fmt(refresh.nominalHz / 120) + '.</span>';
      $('refresh').innerHTML = msg;
      updateDerived();
    });
  }

  // ---------- transmission ----------
  function startTransmission() {
    var f = formParams();
    if (f.mode === 'eyecheck') { startEyeCheck(f); return; }
    var plan = updateDerived();
    if (!plan) return;
    var lv = S.levels(plan);
    enterFullscreen();
    var idle = S.alphaOf(plan, 0.5);
    $('overlay').style.opacity = idle;
    run = { plan: plan, levels: lv, label: f.label, ts: [], k: [], lv: [], drops: 0, aborted: false,
      startedAt: null, periodMs: 1000 / refresh.nominalHz };
    function go() {
      $('overlay').style.opacity = idle;
      run.startedAt = new Date().toISOString();
      countdown(f.countdownSec, function () {
        run.t0 = null;
        requestAnimationFrame(tick);
      });
    }
    if (f.skipPreview || skipPreviewForTest) { go(); return; }
    // Preview: the picture at its brightest transmitted level (alpha = base), so the phone
    // can frame it and lock exposure without clipping any later frame.
    $('overlay').style.opacity = plan.params.base;
    $('setup').classList.add('hidden');
    $('done').classList.add('hidden');
    var cd = $('countdown');
    cd.style.display = 'flex';
    cd.style.fontSize = '4vh';
    cd.textContent = 'Frame the screen, lock exposure, start recording, then press SPACE';
    function onSpace(e) {
      if (e.key === ' ') {
        e.preventDefault();
        document.removeEventListener('keydown', onSpace, true);
        cd.style.fontSize = '';
        go();
      } else if (e.key === 'Escape') {
        document.removeEventListener('keydown', onSpace, true);
        cd.style.display = 'none';
        cd.style.fontSize = '';
        finish(true);
      }
    }
    document.addEventListener('keydown', onSpace, true);
  }

  function tick(t) {
    if (!run || run.aborted) return;
    if (run.t0 === null) { run.t0 = t; run.kk = 0; }
    else {
      var inc = Math.max(1, Math.round((t - run.lastT) / run.periodMs));
      if (inc > 1) run.drops += inc - 1;
      run.kk += inc;
    }
    run.lastT = t;
    if (run.kk >= run.plan.totalFrames) { finish(false); return; }
    var lvl = run.levels[run.kk];
    $('overlay').style.opacity = S.alphaOf(run.plan, lvl);
    run.ts.push(Math.round(t * 1000) / 1000);
    run.k.push(run.kk);
    run.lv.push(lvl);
    requestAnimationFrame(tick);
  }

  function finish(aborted) {
    run.aborted = aborted;
    $('overlay').style.opacity = 0;
    document.body.classList.remove('running');
    var s = S.summary(run.plan, refresh.nominalHz);
    var dur = run.ts.length ? (run.ts[run.ts.length - 1] - run.ts[0]) / 1000 : 0;
    lastLog = {
      schema: 'hilight-txlog-v1',
      label: run.label,
      startedAt: run.startedAt,
      aborted: aborted,
      userAgent: navigator.userAgent,
      screen: { width: screen.width, height: screen.height, devicePixelRatio: window.devicePixelRatio,
        innerWidth: innerWidth, innerHeight: innerHeight },
      refresh: { measuredHz: refresh.measuredHz, nominalHz: refresh.nominalHz, startupFrameIntervalsMs: refresh.samples },
      summary: s,
      plan: run.plan,
      frames: { tsMs: run.ts, k: run.k, level: run.lv },
      droppedFrames: run.drops,
      durationSec: dur
    };
    $('doneTitle').textContent = aborted ? 'ABORTED' : 'DONE';
    $('doneStats').innerHTML = 'Label <b>' + run.label + '</b>. ' + run.k.length + ' display frames rendered over ' +
      fmt(dur, 2) + ' s; ' + run.drops + ' frames dropped (' + fmt(100 * run.drops / Math.max(1, run.plan.totalFrames), 2) +
      '%). Stop the phone recording now, then download the log.';
    $('done').classList.remove('hidden');
    run = null;
    if (window.__onTxDone) window.__onTxDone(lastLog);
  }

  function downloadJSON(obj, name) {
    var blob = new Blob([JSON.stringify(obj)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function countdown(sec, then) {
    $('setup').classList.add('hidden');
    $('done').classList.add('hidden');
    document.body.classList.add('running');
    var cd = $('countdown');
    var n = Math.round(sec);
    if (n <= 0) { then(); return; }
    cd.style.display = 'flex';
    cd.textContent = n;
    var iv = setInterval(function () {
      n -= 1;
      if (n <= 0) { clearInterval(iv); cd.style.display = 'none'; cd.textContent = ''; then(); }
      else cd.textContent = n;
    }, 1000);
  }

  function enterFullscreen() {
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {});
    if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {});
  }

  // ---------- eye check ----------
  function shuffle(arr, seed) {
    var g = new S.Prbs(seed);
    for (var i = arr.length - 1; i > 0; i--) {
      var r = 0;
      for (var b = 0; b < 16; b++) r = (r << 1) | g.next();
      var j = r % (i + 1);
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function eyeTrials(plan, f) {
    var p = plan.params;
    var trials = [];
    [0.1, 0.5].forEach(function (da) {
      p.sweepN.forEach(function (N) { trials.push({ dalpha: da, stimulus: 'bfsk', N: N, rateBps: refresh.nominalHz / N }); });
      // steady square-wave tones (even periods: constant mean alpha), 10 to 60 Hz at 120 Hz
      [12, 8, 6, 4, 2].forEach(function (P) {
        trials.push({ dalpha: da, stimulus: 'tone', period: P, toneHz: refresh.nominalHz / P });
      });
      trials.push({ dalpha: da, stimulus: 'none' });
    });
    return shuffle(trials, p.seed);
  }
  function trialLevels(tr, p, frames, seed) {
    var out = new Float32Array(frames);
    var g = new S.Prbs(seed);
    for (var k = 0; k < frames; k++) {
      var per;
      if (tr.stimulus === 'none') { out[k] = 0.5; continue; }
      if (tr.stimulus === 'bfsk') {
        if (k % tr.N === 0) tr._bit = g.next();
        per = tr._bit ? p.p1 : p.p0;
        out[k] = ((k % tr.N) % per) < per / 2 ? 1 : 0;
      } else {
        out[k] = (k % tr.period) < tr.period / 2 ? 1 : 0;
      }
    }
    return out;
  }
  function startEyeCheck(f) {
    var plan = updateDerived();
    if (!plan) return;
    var trials = eyeTrials(plan, f);
    var eye = { trials: trials, i: 0, results: [], f: f, plan: plan, startedAt: new Date().toISOString() };
    enterFullscreen();
    $('setup').classList.add('hidden');
    function prompt(html) {
      $('eyeBody').innerHTML = html;
      $('eyeprompt').classList.remove('hidden');
    }
    function ask() {
      if (eye.i >= trials.length) { return done(); }
      $('eyeTitle').textContent = 'Eye check: trial ' + (eye.i + 1) + ' of ' + trials.length;
      prompt('<p>Sit at your normal viewing distance and look at the whole picture.</p>' +
        '<p>Press <kbd>Space</kbd> to watch the next ' + f.trialSec + ' s.</p>');
      eye.stage = 'ready';
    }
    function play(replay) {
      var tr = trials[eye.i];
      eye.stage = 'playing';
      $('eyeprompt').classList.add('hidden');
      document.body.classList.add('running');
      var frames = Math.round(f.trialSec * refresh.nominalHz);
      var lv = trialLevels(tr, plan.params, frames, plan.params.seed + eye.i);
      var base = plan.params.base, ov = $('overlay');
      ov.style.opacity = base + tr.dalpha * 0.5;
      var t0 = null, period = 1000 / refresh.nominalHz;
      setTimeout(function () {
        function step(t) {
          if (t0 === null) t0 = t;
          var k = Math.round((t - t0) / period);
          if (k >= frames) {
            ov.style.opacity = base + tr.dalpha * 0.5;
            document.body.classList.remove('running');
            eye.stage = 'answer';
            prompt('<p>Did you notice any flicker or change in the picture?</p>' +
              '<p><kbd>Y</kbd> clearly &nbsp; <kbd>F</kbd> faint / unsure &nbsp; <kbd>N</kbd> none &nbsp; ' +
              '<kbd>R</kbd> replay</p>');
            return;
          }
          ov.style.opacity = base + tr.dalpha * lv[k];
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }, 600);
      if (replay) tr.replays = (tr.replays || 0) + 1;
    }
    function answer(key) {
      var tr = trials[eye.i];
      var r = { trial: eye.i + 1, dalpha: tr.dalpha, stimulus: tr.stimulus, response: key,
        replays: tr.replays || 0 };
      if (tr.N) { r.N = tr.N; r.rateBps = tr.rateBps; }
      if (tr.period) { r.period = tr.period; r.toneHz = tr.toneHz; }
      eye.results.push(r);
      eye.i += 1;
      ask();
    }
    function done() {
      document.removeEventListener('keydown', onKey, true);
      $('overlay').style.opacity = 0;
      $('eyeprompt').classList.add('hidden');
      lastLog = { schema: 'hilight-eyecheck-v1', label: f.label, startedAt: eye.startedAt,
        refresh: { measuredHz: refresh.measuredHz, nominalHz: refresh.nominalHz },
        params: plan.params, trialSec: f.trialSec, results: eye.results, userAgent: navigator.userAgent };
      $('doneTitle').textContent = 'Eye check DONE';
      var lines = eye.results.slice().sort(function (a, b) {
        return a.dalpha - b.dalpha || (a.rateBps || 0) - (b.rateBps || 0);
      }).map(function (r) {
        var what = r.stimulus === 'bfsk' ? fmt(r.rateBps) + ' bps BFSK' : r.stimulus === 'none' ? 'no modulation (control)' :
          'steady ' + fmt(r.toneHz) + ' Hz tone';
        return 'delta alpha ' + r.dalpha + ', ' + what + ': <b>' + r.response + '</b>';
      });
      $('doneStats').innerHTML = lines.join('<br>');
      $('done').classList.remove('hidden');
    }
    function onKey(e) {
      var k = e.key.toLowerCase();
      if (k === 'escape') { eye.i = trials.length; done(); return; }
      if (eye.stage === 'ready' && k === ' ') { e.preventDefault(); play(false); }
      else if (eye.stage === 'answer') {
        if (k === 'y' || k === 'f' || k === 'n') answer(k === 'y' ? 'yes' : k === 'f' ? 'faint' : 'no');
        else if (k === 'r') play(true);
      }
    }
    document.addEventListener('keydown', onKey, true);
    ask();
  }

  // ---------- wiring ----------
  FIELDS.forEach(function (f) { $(f).addEventListener('input', updateDerived); $(f).addEventListener('change', updateDerived); });
  $('start').addEventListener('click', startTransmission);
  $('remeasure').addEventListener('click', function () { measureRefresh(120); });
  $('copyurl').addEventListener('click', function () {
    var q = new URLSearchParams();
    FIELDS.forEach(function (f) { if ($(f).value.trim() !== '') q.set(f, $(f).value.trim()); });
    var url = location.origin + location.pathname + '?' + q.toString();
    if (navigator.clipboard) navigator.clipboard.writeText(url).catch(function () {});
    history.replaceState(null, '', '?' + q.toString());
  });
  $('download').addEventListener('click', function () {
    if (!lastLog) return;
    if (lastLog.schema === 'hilight-eyecheck-v1') downloadJSON(lastLog, 'p3_eyecheck.json');
    else downloadJSON(lastLog, (lastLog.label || 'p3') + '_txlog.json');
  });
  $('again').addEventListener('click', function () {
    $('done').classList.add('hidden');
    $('setup').classList.remove('hidden');
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && run) finish(true);
  });

  var q = readQuery();
  updateDerived();

  // ---------- self test (headless) ----------
  if (q.get('selftest') === '1') {
    var out = {};
    function fnv(str) {
      var h = 0x811c9dc5;
      for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
      return ('00000000' + h.toString(16)).slice(-8);
    }
    try {
      var f = formParams();
      var plan = S.buildPlan(f.plan);
      var bits = plan.blocks.filter(function (b) { return b.type === 'packet'; })
        .map(function (b) { return b.bits.join(''); }).join('|');
      out = { ok: true, params: plan.params, totalFrames: plan.totalFrames, levelsHash: fnv(S.levelString(plan)),
        bitsHash: fnv(bits), summary: S.summary(plan, 120), backgroundLoaded: BG_DATA_URI.length > 1000,
        eyeTrials: eyeTrials(plan, f).length };
    } catch (e) {
      out = { ok: false, error: String(e) };
    }
    $('selftest').textContent = JSON.stringify(out);
    document.body.dataset.selftest = out.ok ? 'ok' : 'fail';
  } else if (q.get('selftest') === 'run') {
    // Runs the real requestAnimationFrame transmission loop (no countdown) and
    // writes the transmit log into the page, for headless-Chrome tests.
    window.__onTxDone = function (log) {
      $('selftest').textContent = JSON.stringify({ ok: true, plan: log.plan.params, totalFrames: log.plan.totalFrames,
        frames: log.frames, droppedFrames: log.droppedFrames, aborted: log.aborted });
      document.body.dataset.selftest = 'ran';
    };
    $('countdownSec').value = '0';
    skipPreviewForTest = true;
    startTransmission();
  } else {
    measureRefresh(120);
  }
})();
</script>
</body>
</html>
